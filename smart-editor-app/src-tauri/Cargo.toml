[package]
name = "smart-editor-app"
version = "0.1.0"
description = "智能文档编写工具"
authors = ["you"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

# 文档解析
docx-rs = "0.4"
pdf-extract = "0.7"
calamine = "0.25"

# 文件扫描
walkdir = "2"

# 数据库
rusqlite = { version = "0.32", features = ["bundled"] }

# 搜索
meilisearch-sdk = "0.27"

# HTTP 客户端（用于调用 AI API）
reqwest = { version = "0.12", features = ["json"] }

# 日志
log = "0.4"
env_logger = "0.11"

# 脱敏规则
regex = "1"

# 剪贴板
arboard = "3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
