[package]
name = "smart-editor-app"
version = "0.3.0"
description = "智能文档编写工具"
authors = ["you"]
edition = "2021"
rust-version = "1.84.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

# 文档解析（按需 feature-gate）
docx-rs = { version = "0.4", optional = true }
pdf-extract = { version = "0.7", optional = true }
calamine = { version = "0.25", optional = true }

# 文件扫描
walkdir = "2"
rayon = "1"

# 数据库
rusqlite = { version = "0.32", features = ["bundled"] }

# 搜索
meilisearch-sdk = "0.27"

# HTTP 客户端（用于调用 AI API）
reqwest = { version = "0.12", features = ["json"] }

# 日志
log = "0.4"
env_logger = "0.11"

# 脱敏规则
regex = "1"
once_cell = "1"

# 剪贴板
arboard = "3"
ammonia = "4"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"

[features]
default = ["custom-protocol", "docx"]
custom-protocol = ["tauri/custom-protocol"]
docx = ["dep:docx-rs"]
pdf = ["dep:pdf-extract"]
excel = ["dep:calamine"]
